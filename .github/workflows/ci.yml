name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # #4 drift gate: committed generated types must match what codegen
      # emits from the vendored schema + documents (all offline, local SDL).
      - run: pnpm codegen && git diff --exit-code -- src/generated
      - run: pnpm typecheck
      - run: pnpm test
